name: Endpoint regression checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/corex/default_layer_test.py
      - run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/endpoint_policy_test.c -o /tmp/endpoint-test
          /tmp/endpoint-test
